services:
  - type: web
    name: sistema-shekinah-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: JWT_SECRET
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: OLLAMA_ENABLED
        value: "false"
