spring.application.name=escala-shekinah

server.port=${PORT:${SERVER_PORT:8081}}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/escala_shekinah}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:escala_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:escala_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=${JWT_SECRET:dev-secret-key-change-this-in-production-dev-secret-key}
app.security.jwt.expiration=86400000

app.assistant.ollama.enabled=${OLLAMA_ENABLED:false}
app.assistant.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.assistant.ollama.model=${OLLAMA_MODEL:llama3.2:1b}

logging.level.org.springframework.security=INFO
logging.level.br.com.escalas=INFO
