server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/escala_shekinah}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:escala_user}
spring.datasource.password=${DB_PASSWORD:escala_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=local-secret-key-local-secret-key-local
app.security.jwt.expiration=86400000

app.assistant.ollama.enabled=${OLLAMA_ENABLED:false}
app.assistant.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.assistant.ollama.model=${OLLAMA_MODEL:llama3.2:1b}
